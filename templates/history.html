<!DOCTYPE html>
<html>
<head>
    <title>Scan History</title>
    <style>
        body { font-family: Arial; background: #f4f6f9; }
        .container { max-width: 1000px; margin: 30px auto; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Scan History</h2>
            <table>
                <tr>
                    <th>ID</th>
                    <th>Target</th>
                    <th>Date</th>
                    <th>Findings</th>
                    <th>Action</th>
                </tr>
                {% for scan in scans %}
                <tr>
                    <td>{{ scan.id }}</td>
                    <td>{{ scan.target_url }}</td>
                    <td>{{ scan.scan_date.strftime('%Y-%m-%d %H:%M') }}</td>
                    <td>{{ scan.total_findings }}</td>
                    <td>
                        <a href="/scan/{{ scan.id }}">View</a> |
                        <a href="/generate-pdf/{{ scan.id }}">PDF</a>
                    </td>
                </tr>
                {% endfor %}
            </table>
            <p style="margin-top:20px;"><a href="/dashboard">Back to Dashboard</a></p>
        </div>
    </div>
</body>
</html>
